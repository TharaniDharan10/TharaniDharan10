<style>
  :root{
    --bg: #0D1117;
    --panel: #10151c;
    --border: #23293380;
    --text: #C9D1D9;
    --dim: #6b7280;
    --violet: #a855f7;
    --violet-deep: #581c87;
    --pink: #ec4899;
    --amber: #f59e0b;
    --red: #ef4444;
    --green: #26a641;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%;
    background:
      radial-gradient(circle at 20% 0%, #581c8722, transparent 45%),
      radial-gradient(circle at 85% 100%, #ec489922, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Fira Code','Cascadia Code','Consolas',monospace;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .crt{
    width:min(880px, 100%);
    height:min(620px, 88vh);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow: 0 30px 80px -20px #000000aa, 0 0 0 1px #00000040;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:linear-gradient(180deg,#161b22,#11151b);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f56; }
  .dot.y{ background:#ffbd2e; }
  .dot.g{ background:#27c93f; }
  .titlebar .path{
    margin:0 auto;
    color:var(--dim);
    font-size:12.5px;
    letter-spacing:.02em;
  }
  #screen{
    flex:1;
    padding:18px 20px;
    overflow-y:auto;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #screen::-webkit-scrollbar{ width:9px; }
  #screen::-webkit-scrollbar-thumb{ background:#2d3440; border-radius:6px; }

  .line{ margin:0 0 2px 0; }
  .prompt-row{ display:flex; gap:8px; }
  .ps1{ color:var(--pink); white-space:nowrap; }
  .ps1 .path{ color:var(--violet); }
  .ps1 .sym{ color:var(--text); }
  .cmdtext{ color:var(--text); }

  .out{ color:var(--text); }
  .dim{ color:var(--dim); }
  .accent{ color:var(--pink); }
  .accent2{ color:var(--violet); }
  .ok{ color:var(--green); }
  .warn{ color:var(--amber); }
  .err{ color:var(--red); }
  a{ color:var(--pink); text-decoration:none; border-bottom:1px dotted #ec489980; }
  a:hover{ color:var(--violet); }

  .banner{
    background: linear-gradient(90deg, var(--pink), var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
  }

  #inputRow{ display:flex; gap:8px; align-items:center; }
  #hiddenInput{
    position:absolute; opacity:0; pointer-events:none;
  }
  .cursor{
    display:inline-block;
    width:8px; height:16px;
    background:var(--pink);
    margin-left:1px;
    vertical-align:-3px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  table.kv{ border-collapse:collapse; margin:6px 0; }
  table.kv td{ padding:1px 10px 1px 0; vertical-align:top; }
  table.kv td.k{ color:var(--violet); white-space:nowrap; }

  ul.plain{ margin:4px 0; padding-left:20px; }
  ul.plain li{ margin:2px 0; }

  @media (max-width:560px){
    body{ padding:0; }
    .crt{ width:100%; height:100vh; border-radius:0; }
    html,body{ font-size:13.5px; }
  }
</style>
</head>

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html;

}
function print(html){
  screen.appendChild(el(`<div class="line">${html}</div>`));

}
function printPromptEcho(cmd){

function escapeHtml(s){

commands['sudo'] = (arg) => `<span class="err">Permission denied:</span> nice try. This terminal doesn't need root — try <span class="accent">help</span>.`;

function handle(raw){
  const cmd = raw.trim();
  if(cmd === ''){ return; }
  const [name, ...rest] = cmd.split(' ');
  const key = name.toLowerCase();

  if(key === 'sudo'){ print(commands.sudo(rest.join(' '))); return; }

  if(commands[key]){
    const out = commands[key]();
    if(out) print(`<div class="out">${out}</div>`);
    return;
  }
  print(`<span class="err">command not found:</span> ${escapeHtml(name)} <span class="dim">— try</span> <span class="accent">help</span>`);
}

// ---- input handling (single hidden input, works on mobile too) ----
let history = [];
let histIdx = -1;

function focusInput(){ hiddenInput.focus(); }
document.addEventListener('click', focusInput);
focusInput();

hiddenInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const val = hiddenInput.value;
    hiddenInput.value = '';
    if(val.trim() !== ''){ history.push(val); }
    histIdx = history.length;
    handle(val);
    renderInputLine();
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(histIdx > 0){ histIdx--; hiddenInput.value = history[histIdx]; renderInputLine(); }
  } else if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(histIdx < history.length - 1){ histIdx++; hiddenInput.value = history[histIdx]; }
    else { histIdx = history.length; hiddenInput.value = ''; }
    renderInputLine();
  }
});
hiddenInput.addEventListener('input', renderInputLine);

let inputLineEl = null;
function renderInputLine(){
  if(!inputLineEl){
    inputLineEl = el(`<div class="line prompt-row">
      <span class="ps1">tharani@github <span class="path">${PROMPT_PATH}</span> <span class="sym">$</span></span>
      <span class="cmdtext" id="typed"></span><span class="cursor"></span>
    </div>`).firstChild;
    screen.appendChild(inputLineEl);
  }
  inputLineEl.querySelector('#typed').textContent = ' ' + hiddenInput.value;
  screen.scrollTop = screen.scrollHeight;
}

function freezeInputLine(){
  if(inputLineEl){ inputLineEl.querySelector('.cursor')?.remove(); inputLineEl = null; }
}

const _origHandle = handle;
handle = function(raw){
  freezeInputLine();
  const firstWord = raw.trim().split(' ')[0]?.toLowerCase();
  _origHandle(raw);
  // 'banner' replays the async boot sequence, which renders its own
  // fresh input line once it finishes — don't race it here.
  if(firstWord !== 'banner'){ renderInputLine(); }
};

// ---- boot sequence ----
function typeLine(text, cls, delay){
  return new Promise(res=>{
    setTimeout(()=>{ print(`<span class="${cls||'out'}">${text}</span>`); res(); }, delay);
  });
}

async function runBoot(){
  screen.innerHTML = '';
  inputLineEl = null;
  await typeLine('booting profile shell...', 'dim', 100);
  await typeLine('loading ~/tharani...', 'dim', 300);
  await typeLine('', '', 150);
  await typeLine('<span class="banner">TD — TERMINAL</span>', '', 150);
  await typeLine('Tharani Dharan Saravanan · Data Engineer', 'accent2', 150);
  await typeLine('', '', 100);
  await typeLine('Type <span class="accent">whoami</span> to get started, or <span class="accent">help</span> for all commands.', 'dim', 200);
  await typeLine('', '', 50);
  renderInputLine();
  focusInput();
}

runBoot();
