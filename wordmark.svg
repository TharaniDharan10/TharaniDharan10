<svg viewBox="0 0 404 254" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TD 3D ASCII wordmark">

  <style>
    .bg { fill: #0D1117; }
    .glyph {
      font-family: 'Cascadia Code','Fira Code','Consolas','DejaVu Sans Mono',monospace;
      font-size: 34px;
      font-weight: 700;
      white-space: pre;
    }
    #wordmark-rig {
      transform-box: fill-box;
      transform-origin: center;
      animation: wipeIn 1s steps(24) forwards, rock 4.5s ease-in-out 1.1s infinite;
    }
    @keyframes wipeIn {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }
    @keyframes rock {
      0%   { transform: scaleX(1)    skewY(0deg); }
      25%  { transform: scaleX(0.86) skewY(0.6deg); }
      50%  { transform: scaleX(1)    skewY(0deg); }
      75%  { transform: scaleX(1.1)  skewY(-0.6deg); }
      100% { transform: scaleX(1)    skewY(0deg); }
    }
  </style>

