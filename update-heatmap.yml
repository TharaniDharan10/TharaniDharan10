name: Update contribution heatmap

on:
  schedule:
    - cron: "0 3 * * *"   # once a day, 03:00 UTC
  workflow_dispatch: {}    # allows manual "Run workflow" trigger
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap SVG
        run: python3 scripts/generate_contribution_svg.py TharaniDharan10 contrib-heatmap.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- contrib-heatmap.svg; then
            git add contrib-heatmap.svg
            git commit -m "chore: refresh contribution heatmap"
            git push
          else
            echo "no changes"
          fi
