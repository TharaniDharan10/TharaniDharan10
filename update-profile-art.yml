name: Update profile art

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate contribution heatmap
        env:
          # A classic PAT with `read:user` scope, saved as a repo secret.
          # (The default GITHUB_TOKEN can't read another user's contribution calendar.)
          GITHUB_TOKEN: ${{ secrets.CONTRIB_PAT }}
        run: python3 scripts/generate_contrib_heatmap.py TharaniDharan10

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap"
          git push